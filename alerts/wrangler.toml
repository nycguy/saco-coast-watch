name = "saco-coastal-alerts"
main = "src/worker.mjs"
compatibility_date = "2026-09-24"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "saco-coastal-alerts"
database_id = "459e72a7-98b1-4dd5-8bfd-8b406468e6bf"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

# Production releases run through the public repository's manually dispatched Worker workflow.
# Wrangler applies this 10-minute cron during deployment; --keep-vars preserves existing runtime variables.
# The Worker gates Web Push behind existing VAPID secrets and explicit feature flags.
