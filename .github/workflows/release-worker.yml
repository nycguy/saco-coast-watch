name: Release coastal alerts Worker
on:
  workflow_dispatch:
    inputs:
      apply_migrations_and_deploy:
        description: Apply reviewed additive D1 migrations if absent, then deploy the Worker and enable its configured 10-minute event check. No test alert is sent.
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: saco-worker-production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        working-directory: alerts
        run: npm install --no-save --no-package-lock --no-audit --no-fund wrangler@4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Inspect VAPID secret state
        id: vapid
        working-directory: alerts
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/worker-secret-names.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          raw=Path('/tmp/worker-secret-names.json').read_text()
          doc=json.loads(raw[raw.find('['):] if '[' in raw else raw)
          names={item.get('name') for item in doc if isinstance(item,dict)}
          has_public='VAPID_PUBLIC_KEY' in names
          has_private='VAPID_PRIVATE_KEY' in names
          if has_public and has_private:
              state='complete'
              print('Existing VAPID key pair is complete; no key values were read or changed.')
          elif not has_public and not has_private:
              state='none'
              print('No VAPID key pair exists yet. Preflight may continue; deployment will create the first pair only after confirming there are no existing push devices.')
          else:
              missing='VAPID_PRIVATE_KEY' if has_public else 'VAPID_PUBLIC_KEY'
              raise SystemExit(f'Partial VAPID configuration detected ({missing} missing); refusing release to avoid rotating an existing production identity.')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'state={state}\n')
          PY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the live email Worker and D1 schema before any write
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://saco-coastal-alerts.mikewiley-nyc.workers.dev/health -o /tmp/worker-before.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/worker-before.json'))
          if d.get('service')!='saco-coastal-alerts' or not d.get('configurationReady') or not d.get('databaseConnected') or d.get('missingTables') or not isinstance(d.get('emailAlertsEnabled'), bool):
              raise SystemExit('Existing live email Worker/D1 health is not verified; stopped before migration or deployment.')
          print('Existing Worker and email/D1 health are ready; the current email alert state will be checked for exact preservation after deployment.')
          PY
          cd alerts
          if ! npx wrangler d1 info saco-coastal-alerts --json > /tmp/d1-info.json 2> /tmp/d1-info.err; then
            echo "D1 metadata lookup failed:"
            cat /tmp/d1-info.err
            exit 1
          fi
          if ! npx wrangler d1 execute saco-coastal-alerts --remote --yes --command="SELECT 1 AS preflight_ok" --json > /tmp/d1-smoke.json 2> /tmp/d1-smoke.err; then
            echo "D1 trivial read failed:"
            cat /tmp/d1-smoke.err
            exit 1
          fi
          rm -f /tmp/d1-schema-parts.ndjson
          schema_queries=(
            "SELECT 'object:' || type || ':' || name AS schema_item FROM sqlite_schema WHERE type IN ('table','index')"
            "SELECT 'subscribers.' || name AS schema_item FROM pragma_table_info('subscribers')"
            "SELECT 'push_subscriptions.' || name AS schema_item FROM pragma_table_info('push_subscriptions')"
            "SELECT 'tokens.' || name AS schema_item FROM pragma_table_info('tokens')"
            "SELECT 'alert_state.' || name AS schema_item FROM pragma_table_info('alert_state')"
            "SELECT 'request_limits.' || name AS schema_item FROM pragma_table_info('request_limits')"
            "SELECT 'coastal_event_snapshots.' || name AS schema_item FROM pragma_table_info('coastal_event_snapshots')"
            "SELECT 'coastal_event_deliveries.' || name AS schema_item FROM pragma_table_info('coastal_event_deliveries')"
            "SELECT 'push_devices.' || name AS schema_item FROM pragma_table_info('push_devices')"
            "SELECT 'push_device_deliveries.' || name AS schema_item FROM pragma_table_info('push_device_deliveries')"
            "SELECT 'push_delivery_queue.' || name AS schema_item FROM pragma_table_info('push_delivery_queue')"
          )
          for query in "${schema_queries[@]}"; do
            if ! npx wrangler d1 execute saco-coastal-alerts --remote --yes --command="$query" --json >> /tmp/d1-schema-parts.ndjson 2> /tmp/d1-schema.err; then
              echo "D1 schema snapshot failed:"
              cat /tmp/d1-schema.err
              exit 1
            fi
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          docs=[]
          raw=Path('/tmp/d1-schema-parts.ndjson').read_text()
          decoder=json.JSONDecoder()
          idx=0
          while idx < len(raw):
              while idx < len(raw) and raw[idx].isspace():
                  idx += 1
              if idx >= len(raw):
                  break
              doc,end=decoder.raw_decode(raw,idx)
              docs.append(doc)
              idx=end
          Path('/tmp/d1-before.json').write_text(json.dumps(docs))
          PY
          cd ..
          python3 scripts/verify_d1_schema.py --schema /tmp/d1-before.json
          state="$(python3 scripts/verify_d1_schema.py --migration-state /tmp/d1-before.json | sed -n 's/^MIGRATION_STATE=//p')"
          test "$state" = absent -o "$state" = complete
          echo "migration_state=$state" >> "$GITHUB_OUTPUT"
          cd alerts
          npx wrangler d1 execute saco-coastal-alerts --remote --command="SELECT COUNT(*) AS subscriber_count FROM subscribers" --json > /tmp/subscribers-before.json
          cd ..
          count="$(python3 -c "import runpy; m=runpy.run_path('scripts/verify_d1_schema.py'); print(m['subscriber_count']('/tmp/subscribers-before.json'))")"
          echo "subscriber_count=$count" >> "$GITHUB_OUTPUT"
          echo "Production preflight passed. Additive schema state: $state. Subscriber count captured privately for preservation check."
      - name: Apply additive event and push migrations when absent
        if: inputs.apply_migrations_and_deploy && steps.preflight.outputs.migration_state == 'absent'
        working-directory: alerts
        run: |
          set -euo pipefail
          npx wrangler d1 execute saco-coastal-alerts --remote --file=migrations/0002_event_notifications.sql
          npx wrangler d1 execute saco-coastal-alerts --remote --file=migrations/0003_push_devices.sql
          npx wrangler d1 execute saco-coastal-alerts --remote --file=migrations/0004_push_delivery_queue.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm complete schema and unchanged subscriber count
        if: inputs.apply_migrations_and_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd alerts
          npx wrangler d1 execute saco-coastal-alerts --remote --file=../scripts/d1_schema_snapshot.sql --json > /tmp/d1-after.json
          npx wrangler d1 execute saco-coastal-alerts --remote --command="SELECT COUNT(*) AS subscriber_count FROM subscribers" --json > /tmp/subscribers-after.json
          cd ..
          python3 scripts/verify_d1_schema.py --push-schema /tmp/d1-after.json --before /tmp/subscribers-before.json --after /tmp/subscribers-after.json
      - name: Preserve or create VAPID identity, enable push, and deploy Worker
        if: inputs.apply_migrations_and_deploy
        working-directory: alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_STATE: ${{ steps.vapid.outputs.state }}
        run: |
          set -euo pipefail
          if [ "$VAPID_STATE" = "none" ]; then
            npx wrangler d1 execute saco-coastal-alerts --remote --command="SELECT COUNT(*) AS device_count FROM push_devices" --json > /tmp/push-devices-before-vapid.json
            device_count="$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/push-devices-before-vapid.json'))
          rows=(d[0].get('results') or []) if isinstance(d,list) and d else []
          print(int((rows[0] if rows else {}).get('device_count') or 0))
          PY
            )"
            test "$device_count" = "0" || { echo "Push devices already exist but no complete VAPID pair is configured; refusing to create a new identity." >&2; exit 1; }
            umask 077
            node - <<'NODE' > /tmp/sacocast-vapid.json
          const { createECDH } = require('node:crypto');
          const ecdh = createECDH('prime256v1'); ecdh.generateKeys();
          console.log(JSON.stringify({
            VAPID_PUBLIC_KEY: ecdh.getPublicKey().toString('base64url'),
            VAPID_PRIVATE_KEY: ecdh.getPrivateKey().toString('base64url')
          }));
          NODE
            npx wrangler secret bulk /tmp/sacocast-vapid.json
            rm -f /tmp/sacocast-vapid.json
            echo "Created the first VAPID key pair after confirming zero existing push devices."
          else
            echo "Existing VAPID identity retained."
          fi
          printf %s true | npx wrangler secret put PUSH_API_ENABLED
          printf %s true | npx wrangler secret put PUSH_EVENTS_ENABLED
          npx wrangler deploy --keep-vars
      - name: Verify deployed Worker health and non-delivery of synthetic alerts
        if: inputs.apply_migrations_and_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://saco-coastal-alerts.mikewiley-nyc.workers.dev/health -o /tmp/worker-after.json
          python3 scripts/verify_worker_health.py /tmp/worker-before.json /tmp/worker-after.json
          curl --fail --silent --show-error -H 'Origin: https://nycguy.github.io' https://saco-coastal-alerts.mikewiley-nyc.workers.dev/push/config -o /tmp/push-config.json
          python3 - <<'PY'
          import json,re
          d=json.load(open('/tmp/push-config.json'))
          if d.get('enabled') is not True or not re.fullmatch(r'[A-Za-z0-9_-]{87,88}',d.get('publicKey','')):
              raise SystemExit('Public push configuration did not initialize; no subscriber test was sent.')
          print('Push configuration is enabled for the public origin. No test push or hazard notification was sent.')
          PY
      - name: Record read-only preflight result
        if: ${{ !inputs.apply_migrations_and_deploy }}
        run: echo 'Preflight only. No migration, Worker deployment, secret change, or notification was performed.'
