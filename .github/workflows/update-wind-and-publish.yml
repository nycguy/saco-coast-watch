name: Refresh marine winds and deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out durable coastal history
        uses: actions/checkout@v7.0.1
        with:
          ref: coastal-history
          path: .history-store
      - name: Retrieve NOAA marine wind observations
        run: python3 scripts/fetch_wind.py
      - name: Retrieve coastal-flood and storm-surge alerts
        run: python3 scripts/fetch_coastal_alerts.py
      - name: Build adaptive NWS / NHC hazard snapshot
        run: python3 scripts/fetch_hazards.py --output data/hazards.json
      - name: Test coastal history and briefing logic
        if: github.event_name != 'schedule'
        run: python3 -m unittest discover -s tests -v
      - name: Validate adaptive front-end syntax
        if: github.event_name != 'schedule'
        run: |
          for file in js/*.js js/*.mjs eastcast/*.mjs alerts/src/*.mjs; do node --check "$file"; done
          node --check push-sw.js
          node --test tests/*.mjs
      - name: Build fixed-window coastal briefing
        run: python3 scripts/fetch_briefing.py --history-input .history-store/data/history/coastal-history.json --output data/coastal-briefing.json --history-output data/coastal-history.json
      - name: Validate alert thresholds and backend syntax
        if: github.event_name != 'schedule'
        run: node --test alerts/test/*.test.mjs
      - name: Capture current coastal webcam previews
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p dist/data/webcams
          python3 scripts/fetch_webcam_snapshots.py --output-dir dist/data/webcams
          if [ -d .history-store/data/webcams/ferry-history ]; then
            mkdir -p dist/data/webcams/ferry-history
            cp -R .history-store/data/webcams/ferry-history/. dist/data/webcams/ferry-history/
          fi
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp favicon.svg favicon-16x16.png favicon-32x32.png dist/
          cp apple-touch-icon.png sacocast-app-icon-192.png dist/
          cp push-sw.js dist/push-sw.js
          cp -R css dist/css
          cp -R js dist/js
          cp data/wind.json dist/data/wind.json
          cp data/coastal-alerts.json dist/data/coastal-alerts.json
          cp data/hazards.json dist/data/hazards.json
          cp data/coastal-briefing.json dist/data/coastal-briefing.json
          cp data/coastal-history.json dist/data/coastal-history.json
          cp -R eastcast dist/eastcast
          mkdir -p dist/eastcast/data
          python3 scripts/fetch_eastcast.py --output dist/eastcast/data/snapshot.json
      - name: Build independently delivered data manifest
        run: python3 scripts/build_data_manifest.py --data-root dist --output dist/data/manifest.json
      - name: Summarize source freshness and validate durable history health
        run: >-
          python3 scripts/monitor_data_health.py
          --data-dir dist/data
          --durable-history .history-store/data/history/coastal-history.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Verify EastCast and coastal history are included in the Pages artifact
        run: |
          python3 scripts/verify_site_artifact.py dist
          test -f dist/eastcast/index.html
          test -s dist/manifest.webmanifest
          test -s dist/favicon.svg
          test -s dist/favicon-16x16.png
          test -s dist/favicon-32x32.png
          test -s dist/apple-touch-icon.png
          test -s dist/sacocast-app-icon-192.png
          grep -q 'sacocast-app-icon-192.png' dist/index.html
          grep -q 'sacocast-app-icon-192.png' dist/manifest.webmanifest
          test -f dist/eastcast/favicon.svg
          test -f dist/eastcast/manifest.webmanifest
          test -f dist/eastcast/app.mjs
          test -f dist/eastcast/core.mjs
          test -f dist/eastcast/style.css
          test -s dist/eastcast/data/snapshot.json
          test -s dist/data/coastal-briefing.json
          test -s dist/data/coastal-history.json
          test -s dist/data/manifest.json
          test -s dist/css/app.css
          for f in config marine data weather water-levels intelligence alerts chart hazards briefing app map webcams; do test -s "dist/js/$f.js"; done
          test -s dist/js/abellona-player.mjs
          test -s dist/data/webcams/webcams.json
          python3 - <<'PY'
          import json
          b=json.load(open('dist/data/coastal-briefing.json'))
          h=json.load(open('dist/data/coastal-history.json'))
          assert b['schema_version']==2
          assert all(k in b for k in ('past_24h','forecast_change_24h','forecast_change_48h','forecast_evolution','event_state','priorities','event_briefing','recent_event','event_transitions','event_history','coastal_impact_change_24h','impact_timeline','impact_timeline_next24','observed_daily_peaks','next_24h','next_72h','local_pulse','current_snapshot'))
          assert isinstance(b['priorities'],list) and len(b['priorities'])<=2
          assert all(item.get('kind') in ('high_water','forecast_change') and item.get('title') and item.get('text') for item in b['priorities'])
          assert h['schema_version']==2
          assert h['thresholds_ft_mllw']=={'minor':12.0,'moderate':13.0,'major':14.0}
          hz=json.load(open('dist/data/hazards.json'))
          assert hz['schema_version']==1
          assert all(k in hz for k in ('active_modes','severity','event_state','marine_alerts','surf','winter','rain','wind','cold','tropical','hourly','hourly_full'))
          assert len(h.get('snapshots',[]))>=1
          w=json.load(open('dist/data/webcams/webcams.json'))
          assert w['schema_version']==1
          assert set(w.get('cameras',{}))=={'ferry_beach','abellona'}
          assert w['cameras']['ferry_beach'].get('status') in ('ok','unavailable')
          if w['cameras']['ferry_beach'].get('status')=='ok':
              assert w['cameras']['ferry_beach'].get('image')
          assert w['cameras']['abellona'].get('status')=='live_embed'
          assert w['cameras']['abellona'].get('image') is None
          PY
          python3 -c "import json; d=json.load(open('dist/eastcast/data/snapshot.json')); assert d['schema_version']==2; assert 'summary' in d and 'alerts' in d and 'outlooks' in d; assert len(d.get('coastal_pulse',[])) >= 4; assert d.get('sources',{}).get('coastal_pulse',{}).get('ok')"
      - name: Browser map smoke test before publishing
        if: github.event_name != 'schedule'
        run: |
          python3 -m venv /tmp/saco-map-venv
          /tmp/saco-map-venv/bin/python -m pip install --disable-pip-version-check -r tests/requirements-browser.txt
          /tmp/saco-map-venv/bin/python -m playwright install chromium
          SACOCAST_SMOKE_URL=https://nycguy.github.io/saco-coast-watch/ /tmp/saco-map-venv/bin/python tests/capture_ui_audit.py --base-url https://nycguy.github.io/saco-coast-watch/ --output-dir ui-audit --prefix baseline
          python3 -m http.server 8765 --directory dist > /tmp/saco-map-http.log 2>&1 &
          /tmp/saco-map-venv/bin/python tests/map_smoke.py
          /tmp/saco-map-venv/bin/python tests/tide_outlook_smoke.py
          /tmp/saco-map-venv/bin/python tests/eastcast_smoke.py
          /tmp/saco-map-venv/bin/python tests/push_ui_smoke.py
          /tmp/saco-map-venv/bin/python tests/abellona_player_smoke.py
          /tmp/saco-map-venv/bin/python tests/responsive_accessibility_smoke.py
          SACOCAST_ALERT_SCREENSHOT_DIR=ui-audit /tmp/saco-map-venv/bin/python tests/weather_alerts_smoke.py
      - name: Save map test screenshot
        if: failure() && github.event_name != 'schedule'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dashboard-browser-test-images
          retention-days: 1
          path: |
            map-smoke*.png
            tide-outlook-smoke-*.png
            eastcast-smoke-*.png
            push-notifications-smoke-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages&per_page=100"
          for attempt in $(seq 1 12); do
            artifact_count="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${artifact_url}" | python3 -c 'import json,sys; print(sum(1 for a in json.load(sys.stdin).get("artifacts",[]) if a.get("name")=="github-pages" and not a.get("expired")))')"
            if [ "$artifact_count" -ge 1 ]; then
              echo "Pages artifact is registered and available to deploy-pages."
              echo "Allowing the artifact service to finish propagating metadata before deployment."
              sleep 10
              exit 0
            fi
            echo "Pages artifact is not visible to the Actions API yet (attempt ${attempt}/12); waiting 5 seconds."
            sleep 5
          done
          echo "Pages artifact was uploaded but did not become visible before deployment." >&2
          exit 1
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify live production after Pages deployment
        if: github.event_name != 'schedule'
        env:
          SACOCAST_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
          SACOCAST_LIVE_SMOKE: '1'
        run: |
          set -euo pipefail
          assets_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error "${SACOCAST_SMOKE_URL%/}/push-sw.js" -o /tmp/live-push-sw.js &&
               curl --fail --silent --show-error "${SACOCAST_SMOKE_URL%/}/manifest.webmanifest" -o /tmp/live-manifest.webmanifest; then
              assets_ready=1
              break
            fi
            echo "Waiting for GitHub Pages production deployment to propagate (attempt $attempt/20)..."
            sleep 5
          done
          if [ "$assets_ready" -ne 1 ]; then
            echo "Live Pages production assets did not propagate within the retry window." >&2
            exit 1
          fi
          /tmp/saco-map-venv/bin/python tests/push_ui_smoke.py
          /tmp/saco-map-venv/bin/python tests/abellona_live_smoke.py
          /tmp/saco-map-venv/bin/python tests/responsive_accessibility_smoke.py
          echo "Live Pages production verification passed."
      - name: Capture deployed UI audit screenshots
        if: github.event_name != 'schedule'
        env:
          SACOCAST_SMOKE_URL: ${{ steps.deployment.outputs.page_url }}
        run: /tmp/saco-map-venv/bin/python tests/capture_ui_audit.py --base-url "$SACOCAST_SMOKE_URL" --output-dir ui-audit --prefix after
      - name: Retain before and after UI audit screenshots
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sacocast-ui-audit-before-after
          retention-days: 1
          path: |
            ui-audit/*.jpg
            ui-audit/active-alert-*.png
          if-no-files-found: error
      - name: Publish validated data snapshot to independent delivery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish_dir="$(mktemp -d)"
          previous_manifest="/tmp/sacocast-previous-manifest.json"
          if git fetch --quiet origin data-delivery:refs/remotes/origin/data-delivery; then
            git clone --quiet --depth 1 --branch data-delivery "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
            if [ -f "$publish_dir/current/manifest.json" ]; then cp "$publish_dir/current/manifest.json" "$previous_manifest"; fi
          else
            git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$publish_dir"
            git -C "$publish_dir" checkout --quiet --orphan data-delivery
            git -C "$publish_dir" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "$publish_dir/current"
          mkdir -p "$publish_dir/current/data/webcams" "$publish_dir/current/eastcast/data"
          cp dist/data/manifest.json "$publish_dir/current/manifest.json"
          cp dist/data/wind.json dist/data/coastal-alerts.json dist/data/hazards.json dist/data/coastal-briefing.json dist/data/coastal-history.json "$publish_dir/current/data/"
          cp dist/data/webcams/webcams.json "$publish_dir/current/data/webcams/webcams.json"
          cp dist/eastcast/data/snapshot.json "$publish_dir/current/eastcast/data/snapshot.json"
          if [ -f "$previous_manifest" ] && python3 - "$previous_manifest" "$publish_dir/current/manifest.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          raise SystemExit(0 if a.get('datasets')==b.get('datasets') else 1)
          PY
          then
            echo "Independent publication skipped: dataset hashes are unchanged."
            exit 0
          fi
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add current
          git -C "$publish_dir" commit --quiet -m "Publish coastal data snapshot ${GITHUB_SHA::12}"
          git -C "$publish_dir" push --quiet origin HEAD:data-delivery
          echo "Published independent data snapshot to data-delivery."
      - name: Verify independent data delivery headers, hashes, and JSON
        run: python3 scripts/verify_data_delivery.py https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-delivery/current


