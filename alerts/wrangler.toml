name = "saco-coastal-alerts"
main = "src/worker.mjs"
compatibility_date = "2026-09-24"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "saco-coastal-alerts"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
PUBLIC_SITE = "https://nycguy.github.io/saco-coast-watch/"
ALLOWED_ORIGIN = "https://nycguy.github.io"
SENDER_NAME = "Saco Coast Watch"
# Sensitive credentials must be set with wrangler secret put, never added to this file.
