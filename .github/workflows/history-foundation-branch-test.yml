name: Validate history foundation branch
on:
  push:
    branches: [history-foundation-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m py_compile scripts/history_core.py scripts/capture_history.py scripts/backfill_gomofs.py scripts/fetch_briefing.py
      - name: Run deterministic tests
        run: python3 -m unittest tests/test_history_core.py tests/test_capture_history.py tests/test_fetch_briefing.py
