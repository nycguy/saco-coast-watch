name: Refresh marine winds and deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out durable coastal history
        uses: actions/checkout@v4
        with:
          ref: coastal-history
          path: .history-store
      - name: Retrieve NOAA marine wind observations
        run: python3 scripts/fetch_wind.py
      - name: Retrieve coastal-flood and storm-surge alerts
        run: python3 scripts/fetch_coastal_alerts.py
      - name: Build adaptive NWS / NHC hazard snapshot
        run: python3 scripts/fetch_hazards.py --output data/hazards.json
      - name: Test coastal history and briefing logic
        run: python3 -m unittest tests/test_history_core.py tests/test_capture_history.py tests/test_fetch_briefing.py tests/test_fetch_webcam_snapshots.py tests/test_frontend_architecture.py tests/test_fetch_hazards.py tests/test_fetch_wind.py tests/test_archive_ferry_camera.py
      - name: Validate adaptive front-end syntax
        run: |
          node --check js/hazards.js
          node --check js/intelligence.js
          node --check js/weather.js
          node --check js/app.js
          node --check js/map.js
          node --test tests/hazard_modes_unit.mjs
      - name: Build fixed-window coastal briefing
        run: python3 scripts/fetch_briefing.py --history-input .history-store/data/history/coastal-history.json --output data/coastal-briefing.json --history-output data/coastal-history.json
      - name: Validate alert thresholds and backend syntax
        run: |
          node --check alerts/src/worker.mjs
          node --test alerts/test/*.test.mjs
      - name: Run EastCast unit tests
        run: |
          node --check eastcast/core.mjs
          node --check eastcast/app.mjs
          node --test tests/eastcast_unit.mjs
          python3 -m unittest tests/test_fetch_eastcast.py
      - name: Capture current coastal webcam previews
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          mkdir -p dist/data/webcams
          python3 scripts/fetch_webcam_snapshots.py --output-dir dist/data/webcams
          if [ -d .history-store/data/webcams/ferry-history ]; then
            mkdir -p dist/data/webcams/ferry-history
            cp -R .history-store/data/webcams/ferry-history/. dist/data/webcams/ferry-history/
          fi
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp manifest.webmanifest dist/manifest.webmanifest
          cp favicon.svg favicon-16x16.png favicon-32x32.png dist/
          cp apple-touch-icon.png sacocast-app-icon-192.png dist/
          cp -R css dist/css
          cp -R js dist/js
          cp data/wind.json dist/data/wind.json
          cp data/coastal-alerts.json dist/data/coastal-alerts.json
          cp data/hazards.json dist/data/hazards.json
          cp data/coastal-briefing.json dist/data/coastal-briefing.json
          cp data/coastal-history.json dist/data/coastal-history.json
          cp -R eastcast dist/eastcast
          mkdir -p dist/eastcast/data
          python3 scripts/fetch_eastcast.py --output dist/eastcast/data/snapshot.json
      - name: Verify EastCast and coastal history are included in the Pages artifact
        run: |
          test -f dist/eastcast/index.html
          test -s dist/manifest.webmanifest
          test -s dist/favicon.svg
          test -s dist/favicon-16x16.png
          test -s dist/favicon-32x32.png
          test -s dist/apple-touch-icon.png
          test -s dist/sacocast-app-icon-192.png
          grep -q 'sacocast-app-icon-192.png' dist/index.html
          grep -q 'sacocast-app-icon-192.png' dist/manifest.webmanifest
          test -f dist/eastcast/favicon.svg
          test -f dist/eastcast/manifest.webmanifest
          test -f dist/eastcast/app.mjs
          test -f dist/eastcast/core.mjs
          test -f dist/eastcast/style.css
          test -s dist/eastcast/data/snapshot.json
          test -s dist/data/coastal-briefing.json
          test -s dist/data/coastal-history.json
          test -s dist/css/app.css
          for f in config marine data weather water-levels intelligence alerts chart hazards briefing app map webcams; do test -s "dist/js/$f.js"; done
          test -s dist/data/webcams/webcams.json
          python3 - <<'PY'
          import json
          b=json.load(open('dist/data/coastal-briefing.json'))
          h=json.load(open('dist/data/coastal-history.json'))
          assert b['schema_version']==2
          assert all(k in b for k in ('past_24h','forecast_change_24h','forecast_change_48h','forecast_evolution','event_state','event_briefing','recent_event','event_transitions','event_history','coastal_impact_change_24h','impact_timeline','impact_timeline_next24','observed_daily_peaks','next_24h','next_72h','local_pulse','current_snapshot'))
          assert h['schema_version']==2
          assert h['thresholds_ft_mllw']=={'minor':12.0,'moderate':13.0,'major':14.0}
          hz=json.load(open('dist/data/hazards.json'))
          assert hz['schema_version']==1
          assert all(k in hz for k in ('active_modes','severity','event_state','marine_alerts','surf','winter','rain','wind','cold','tropical','hourly','hourly_full'))
          assert len(h.get('snapshots',[]))>=1
          w=json.load(open('dist/data/webcams/webcams.json'))
          assert w['schema_version']==1
          assert set(w.get('cameras',{}))=={'ferry_beach','abellona'}
          assert w['cameras']['ferry_beach'].get('status') in ('ok','unavailable')
          if w['cameras']['ferry_beach'].get('status')=='ok':
              assert w['cameras']['ferry_beach'].get('image')
          assert w['cameras']['abellona'].get('status')=='live_embed'
          assert w['cameras']['abellona'].get('image') is None
          PY
          python3 -c "import json; d=json.load(open('dist/eastcast/data/snapshot.json')); assert d['schema_version']==2; assert 'summary' in d and 'alerts' in d and 'outlooks' in d; assert len(d.get('coastal_pulse',[])) >= 4; assert d.get('sources',{}).get('coastal_pulse',{}).get('ok')"
      - name: Browser map smoke test before publishing
        if: github.event_name == 'push'
        run: |
          python3 -m venv /tmp/saco-map-venv
          /tmp/saco-map-venv/bin/python -m pip install --disable-pip-version-check playwright pillow
          /tmp/saco-map-venv/bin/python -m playwright install chromium
          python3 -m http.server 8765 --directory dist > /tmp/saco-map-http.log 2>&1 &
          /tmp/saco-map-venv/bin/python tests/map_smoke.py
          /tmp/saco-map-venv/bin/python tests/tide_outlook_smoke.py
          /tmp/saco-map-venv/bin/python tests/eastcast_smoke.py
      - name: Save map test screenshot
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-test-images
          path: |
            map-smoke*.png
            tide-outlook-smoke-*.png
            eastcast-smoke-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
