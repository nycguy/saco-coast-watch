name: Refresh marine winds and deploy dashboard
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve NOAA marine wind observations
        run: python3 scripts/fetch_wind.py
      - name: Retrieve coastal-flood and storm-surge alerts
        run: python3 scripts/fetch_coastal_alerts.py
      - name: Validate alert thresholds and backend syntax
        run: |
          node --check alerts/src/worker.mjs
          node --test alerts/test/*.test.mjs

      - name: Run EastCast unit tests
        run: |
          node --check eastcast/core.mjs
          node --check eastcast/app.mjs
          node --test tests/eastcast_unit.mjs
          python3 -m unittest tests/test_fetch_eastcast.py
      - name: Assemble site
        run: |
          mkdir -p dist/data
          cp index.html dist/index.html
          cp data/wind.json dist/data/wind.json
          cp data/coastal-alerts.json dist/data/coastal-alerts.json
          cp -R eastcast dist/eastcast
          mkdir -p dist/eastcast/data
          python3 scripts/fetch_eastcast.py --output dist/eastcast/data/snapshot.json
      - name: Verify EastCast is included in the Pages artifact
        run: |
          test -f dist/eastcast/index.html
          test -f dist/eastcast/favicon.svg
          test -f dist/eastcast/manifest.webmanifest
          test -f dist/eastcast/app.mjs
          test -f dist/eastcast/core.mjs
          test -f dist/eastcast/style.css
          test -s dist/eastcast/data/snapshot.json
          python3 -c "import json; d=json.load(open('dist/eastcast/data/snapshot.json')); assert d['schema_version']==2; assert 'summary' in d and 'alerts' in d and 'outlooks' in d; assert len(d.get('coastal_pulse',[])) >= 4; assert d.get('sources',{}).get('coastal_pulse',{}).get('ok')"

      - name: Browser map smoke test before publishing
        if: github.event_name == 'push'
        run: |
          python3 -m venv /tmp/saco-map-venv
          /tmp/saco-map-venv/bin/python -m pip install --disable-pip-version-check playwright pillow
          /tmp/saco-map-venv/bin/python -m playwright install chromium
          python3 -m http.server 8765 --directory dist > /tmp/saco-map-http.log 2>&1 &
          /tmp/saco-map-venv/bin/python tests/map_smoke.py
          /tmp/saco-map-venv/bin/python tests/eastcast_smoke.py
      - name: Save map test screenshot
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-test-images
          path: |
            map-smoke*.png
            eastcast-smoke-*.png
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
