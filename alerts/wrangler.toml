name = "saco-coastal-alerts"
main = "src/worker.mjs"
compatibility_date = "2026-09-24"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "saco-coastal-alerts"
database_id = "459e72a7-98b1-4dd5-8bfd-8b406468e6bf"
migrations_dir = "migrations"

[triggers]
crons = ["*/10 * * * *"]

# Set LIVE_ALERTS=true and all runtime variables and secrets in Cloudflare Worker Settings.
# Dashboard-based deployment also requires adding this Cron Trigger in Cloudflare UI.
# This release sends EMAIL ONLY. Web Push remains disabled.
